<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            color: #2373c3;
        }

        ol, ul {
            font-size: 18px;
            
        }
    </style>
</head>
<body>

    <h2>My Favorite Movies</h2>
    <ol>
        <li>Leo</li>
        <li>Master</li>
        <li>Jailer</li>
    </ol>

    <h2>My Goals This Year</h2>
    <ul>
        <li>Become a full-stack web developer</li>
        <li>Improve communication in English</li>
        <li>Build real-world projects</li>
    </ul>

</body>
</html>
