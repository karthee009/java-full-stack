<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>attribute src img alt</title>
</head>
<body>
    <h1 style="text-align: center;">Attributes using href src and alt</h1>
    <img src="./images/sla.png" alt="SLA Institute Logo" style="width:200px;height:200px;margin-left:auto;margin-right:auto;display:block;">
    <p style="text-align: center;"> image above uses the <strong>src</strong> attribute to specify the path to the image file and the <strong>alt</strong>
        attribute to provide alternative text if the image cannot be displayed.</p>
    <br>
    <div style="font-size: 30px;text-align: center;">
        <a href="https://www.slainstitute.com/" target="_blank">Visit SLA Institute Website</a>
        </div>
        <div>
             <h2>Clickable Image</h2>
  <a href="https://www.google.com" target="_blank">
    <img src="images/sla.png" alt="Google" width="150">
  </a>

        </div>
    
</body>
</html>
