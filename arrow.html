// //sum 

const sumOfDigits = (num) => {
  let sum = 0;

  while(num > 0){
    let digit = num % 10;
    sum = sum + digit;
    num = Math.floor(num / 10);
  }

  return sum;
}

console.log(sumOfDigits(123)); // 6
