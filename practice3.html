<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block & inline elements</title>
</head>
<body>
    <h1>showing block and inline elements</h1>
    <p>This is a paragraph demonstrating <strong>block</strong> and <em>inline</em>elements.</p>
    <div style="border: 1px solid black; padding: 10px; margin-top: 10px;">
        This is a block-level element (div). It takes up the full width available.
        <p>Another paragraph inside the div.</p>
        </div>
    </body>
</html>
