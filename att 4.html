<!DOCTYPE html>
<html lang="en">
<head>
  <title>Image Practice</title>
  <style>
    .responsive-img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h2>Image with Width & Height</h2>
  <img src="images/nivia.jpeg" alt="Volleyball" width="300" height="200">

  <h2>Responsive Image</h2>
  <img src="images/JD.jpeg" alt="Volleyball" class="responsive-img">

  <h2>Clickable Image</h2>
  <a href="https://www.google.com" target="_blank">
    <img src="images/sla.png" alt="Google" width="150">
  </a>

</body>
</html>
