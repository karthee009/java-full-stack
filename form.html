<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
    <style>
       
    form{
        border-style: ridge ;
        border-width: 8px;
        width: max-content;
        margin: auto;
        justify-content: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    
    body{
        background-color: rgb(248, 246, 246);
    }
    input{
        margin: 5px;
        padding: 7px;
        border-radius: 5px;
        
        
    }
    footer{
        background:linear-gradient(rgb(231, 211, 211),rgb(179, 14, 14));
    }
    #empty{
        width: 100px;
        height: 100px;
        background-color: rgb(223, 179, 179);
        transition: width 2s;
    }
    #empty:hover{
        width: 300px;
    }
   button{
width: 120px;
height: 30px;
border-style: groove;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
font-size: 15px;
   }
   .sbt{
    background-color: green;
    color: white;
   }
   .rst{
    background-color: red;
    color: white;
   }
    </style>
</head>
<body>
   
    <section>
        <h1 style="text-align: center;">login form</h1>
    
        <form action="success.html" method="get" style="text-align: center;">
            <label for="fname">enter your first name <sup style="color: red;">*</sup>: </label>
         <input type="text" id="fname" name="fname" placeholder="enter your name" required ><br><br>

         <label for="Email">enter youe email <sup style="color: red;">*</sup>: </label>
         <input type="email" id="email" name="email" placeholder="enter your email" required><br><br>

         <label for="phn">phone <sup style="color: red;">*</sup> : </label>
         <input type="tel" id="phn" name="phn" placeholder="enter your phn num " ><br><br>

         <label for="age">age : </label>
         <input type="number" id="age" name="age" placeholder="enter your age" ><br><br>

         <label for="address">Address : </label>
            <input type="text" id="address" name="address" placeholder="enter your address" ><br><br>

            <label for="dob">DOB : </label>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="disabilities">disabilities</label>
            <input type="radio" name="disabilities">yes
            <input type="radio" name="disabilities">no   <br><br>

            <label for="resume">resume <sup style="color: red;">*</sup> : </label>
            <input type="file" id="file" name="file" ><br><br>

            <label for="degree">qualifications : </label>

            <select name="degree" id="degree">
            <option>bsc cs</option>
            <option>bsc phy</option>
            <option>bsc che</option>
            <option>bsc bio</option>
            <option>bca</option>
            <option>bba</option>
            <option>bcom ca</option>
            </select>
<br><br>
            <button type="submit" class="sbt">submit</button>
            <button type="reset" class="rst">reset</button>
           
            

        </form>
    <div>
    <textarea name="feedback" id="feedback" rows="5" columns="50" style="text-align: center;display: flex;justify-content: center;margin: auto;" >give feedback about web page :</textarea>
    </div>
    
    </section>



</body>
</html>
